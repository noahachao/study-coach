name: Static analysis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml

      - name: zizmor
        run: |
          python3 -m pip install --quiet --user zizmor==1.33.1
          export PATH="$HOME/.local/bin:$PATH"
          zizmor --min-severity high .github/workflows

  static:
    name: Language checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ hashFiles('package-lock.json') != '' }}
        with:
          node-version: 22
      - name: Node / TypeScript (ESLint + tsc)
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          npm install -g npm@11
          npm ci --ignore-scripts
          if [ -f prisma/schema.prisma ]; then npx prisma generate >/dev/null; fi
          if [ -f tsconfig.json ] && grep -q '"references"' tsconfig.json; then
            if [ -x node_modules/.bin/vue-tsc ]; then node_modules/.bin/vue-tsc -b; else node_modules/.bin/tsc -b; fi
          elif [ -f tsconfig.json ] && [ -x node_modules/.bin/tsc ]; then
            node_modules/.bin/tsc --noEmit
          fi
          if [ -x node_modules/.bin/eslint ]; then node_modules/.bin/eslint .; fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements/**') != '' }}
        with:
          python-version: "3.12"
      - name: Python (ruff + mypy)
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements/**') != '' }}
        run: |
          python3 -m pip install --quiet ruff==0.17.6 mypy
          python3 -m ruff check .
          python3 -m mypy --ignore-missing-imports .

      - name: Go (go vet + golangci-lint)
        run: |
          MODS=$(find . -name go.mod -not -path '*/node_modules/*' -not -path '*/.git/*')
          if [ -z "$MODS" ]; then echo "skip: no go.mod"; exit 0; fi
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          for M in $MODS; do
            D=$(dirname "$M")
            echo "== $D =="
            (cd "$D" && go vet ./... && "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...)
          done

      - name: Rust (clippy)
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -W clippy::all
