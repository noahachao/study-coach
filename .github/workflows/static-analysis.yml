name: Static analysis (observe-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Workflow lint (actionlint)
        run: |
          set +e
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color .github/workflows/*.yml
          exit 0

      - name: Workflow security (zizmor)
        run: |
          set +e
          python3 -m pip install --quiet --user zizmor==1.33.1
          export PATH="$HOME/.local/bin:$PATH"
          zizmor --format plain .github/workflows
          exit 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: 22
      - name: Node / TypeScript (ESLint + tsc)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set +e
          npm install -g npm@11
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi
          if [ -f tsconfig.json ] && [ -x node_modules/.bin/tsc ]; then node_modules/.bin/tsc --noEmit; fi
          if [ -x node_modules/.bin/eslint ]; then node_modules/.bin/eslint .; fi
          exit 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements/**') != '' }}
        with:
          python-version: "3.12"
      - name: Python (ruff + mypy)
        if: ${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements/**') != '' }}
        run: |
          set +e
          python3 -m pip install --quiet ruff==0.17.6 mypy
          python3 -m ruff check .
          python3 -m mypy --ignore-missing-imports .
          exit 0

      - name: Go (go vet + golangci-lint)
        run: |
          set +e
          MODS=$(find . -name go.mod -not -path '*/node_modules/*' -not -path '*/.git/*')
          if [ -z "$MODS" ]; then echo "skip: no go.mod"; exit 0; fi
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          for M in $MODS; do
            D=$(dirname "$M")
            echo "== $D =="
            (cd "$D" && go vet ./... && "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m ./...)
          done
          exit 0

      - name: Rust (clippy)
        if: ${{ hashFiles('Cargo.toml') != '' }}
        run: |
          set +e
          rustup component add clippy
          cargo clippy --all-targets -- -W clippy::all
          exit 0
